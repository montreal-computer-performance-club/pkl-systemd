name: Release
on:
  push:
    tags:
      # Bare semantic versions, e.g. 1.2.3. The tag name becomes the package
      # version and is part of the package URI, so it must not carry a prefix.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the GitHub release and upload assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: "0.31.1"

      - name: Run tests
        run: pkl test

      - name: Package
        run: |
          mkdir -p dist
          PKL_PACKAGE_VERSION="${GITHUB_REF_NAME}" pkl project package --output-path dist

      - name: Write release notes header
        run: |
          cat > notes.md <<EOF
          ## Installation

          Add to your \`PklProject\` dependencies:

          \`\`\`
          dependencies {
              ["systemd"] = "package://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/pkl-systemd@${GITHUB_REF_NAME}"
          }
          \`\`\`

          Or amend a unit module directly:

          \`\`\`pkl
          amends "package://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/pkl-systemd@${GITHUB_REF_NAME}#/Service.pkl"
          \`\`\`

          Podman Quadlet units live under \`podman/\`:

          \`\`\`pkl
          amends "package://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/pkl-systemd@${GITHUB_REF_NAME}#/podman/Container.pkl"
          \`\`\`

          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
